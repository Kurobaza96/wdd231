<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Basic HTML Page</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 2rem;
        line-height: 1.6;
      }
      header {
        border-bottom: 2px solid #333;
        padding-bottom: 1rem;
        margin-bottom: 1rem;
      }
      h1 {
        margin-bottom: 0.5rem;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Welcome</h1>
    </header>

    <main>
      <p>This is a basic HTML page.</p>
      <p>You can add paragraphs, headings, lists, and other content here.</p>

      <h2>Example List</h2>
      <ul>
        <li>Item one</li>
        <li>Item two</li>
        <li>Item three</li>
      </ul>
    </main>
  </body>
</html>
